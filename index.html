

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Carte IAV Hassan II - Rabat</title>

    <!-- Bibliothèque CSS Leaflet -->
    <link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Bibliothèque JavaScript Leaflet -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        .titre {
            position: absolute;
            top: 15px;
            left: 65px;
            z-index: 1000;
            background: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #777;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="titre">
        IAV Hassan II - Rabat
    </div>

    <div id="map"></div>

    <script>

        // Coordonnées de l'IAV Hassan II
        const latitude = 33.9782;
        const longitude = -6.86478;

        // Initialiser la carte Leaflet
        const map = L.map('map').setView(
            [latitude, longitude], 17
        );

        // Fond satellite Esri
        const satellite = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
                maxZoom: 19,
                attribution:
                    'Imagery &copy; Esri and its data providers'
            }
        );

        satellite.addTo(map);

        // Marqueur de l'IAV
        const marker = L.marker([
            latitude, longitude
        ]).addTo(map);

        marker.bindPopup(
            '<b>Institut Agronomique et Vétérinaire Hassan II</b>' +
            '<br>Rabat, Maroc'
        ).openPopup();

        // Cercle de 250 mètres
        const cercle = L.circle(
            [latitude, longitude],
            {
                color: 'red',
                fillColor: '#ff3366',
                fillOpacity: 0.20,
                radius: 250
            }
        ).addTo(map);

        cercle.bindPopup(
            'Zone indicative de 250 mètres autour de l’IAV'
        );

        // Échelle de la carte
        L.control.scale({
            metric: true,
            imperial: false
        }).addTo(map);

        // Afficher les coordonnées au clic
        map.on('click', function(e) {

            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);

            L.popup()
                .setLatLng(e.latlng)
                .setContent(
                    '<b>Coordonnées géographiques</b>' +
                    '<br>Latitude : ' + lat +
                    '<br>Longitude : ' + lng
                )
                .openOn(map);

        });

    </script>

</body>
</html>
